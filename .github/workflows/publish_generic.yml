name: publish

on:
  push:
    branches: [ master ]

jobs:
  build:
    name: build & test & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      ##
      # Setup
      # Setup .NET versions for multi-target build (netstandard2.1 + net10.0).
      ##
      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      ##
      # Dependencies
      # Restore the project and its dependencies.
      ##
      - name: Install dependencies
        run: dotnet restore

      ##
      # Publish
      ##
      - name: Publish Ajuna.SAGE.Generic
        id: publish_nuget_1
        uses: alirezanet/publish-nuget@v3.0.4
        with:
          # Filepath of the project to be packaged, relative to root of repository
          PROJECT_FILE_PATH: Ajuna.SAGE.Generic/Ajuna.SAGE.Generic.csproj
          # NuGet package id, used for version detection & defaults to project name
          PACKAGE_NAME: Ajuna.SAGE.Generic
          # API key to authenticate with NuGet server
          NUGET_KEY: ${{secrets.NUGET_API_KEY}}
